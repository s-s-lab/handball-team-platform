name: CI

on:
  push:
    branches:
      - main
      - "phase-*"
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Unit tests
        run: npm test
      - name: TypeScript
        run: npm run typecheck
      - name: ESLint
        run: npm run lint
      - name: Production build
        run: npm run build

  browser-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      BROWSER_QA: "1"
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Install browser QA runner
        run: npm install --no-save --no-audit --no-fund @playwright/test@1.55.0
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Production build for browser QA
        run: npm run build
      - name: Real browser QA
        run: npx playwright test --config=playwright.config.mjs
      - name: Upload browser QA artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phase7-browser-qa
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
